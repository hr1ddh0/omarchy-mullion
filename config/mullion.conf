# Mullion settings.
#
# Written by the settings panel (click the Mullion icon in the bar), but it
# is a plain key=value file, so editing it by hand works just as well. Values
# are read by the Hyprland config, the drag-snap helper, and the panel itself.
#
# Run `hyprctl reload` after editing by hand.

# --- Style ------------------------------------------------------------------
# Which platform's window controls to wear:
#   macos    traffic lights on the left, title centred, soft deep shadow
#   windows  caption buttons on the right, title left, tighter shadow
#   none     a title bar you can drag, with no buttons on it
# Snapping, split screen and edge-resize behave the same whichever you pick.
window_style = macos

# --- Title bar -------------------------------------------------------------
# Diameter of each traffic light, in pixels. macOS uses 12.
button_size = 12
# Height of the title bar. macOS uses 28.
bar_height = 28
# Show the glyphs inside the dots always, or only while hovering the bar
# (which is what macOS does).
icons_always_visible = true

# --- Window ----------------------------------------------------------------
rounding = 10
border_size = 3
gaps_in = 6
gaps_out = 12
# Open new windows floating rather than tiled.
float_by_default = true

# --- Drop shadow -----------------------------------------------------------
shadow = true
shadow_range = 32
# 0-255. Higher is a heavier shadow.
shadow_opacity = 115

# --- Snapping --------------------------------------------------------------
# Drag a window to a screen edge to snap it there.
drag_snap = true
# How close to an edge counts as touching it, in pixels.
snap_edge = 10
# How far along an edge still counts as its corner.
snap_corner = 140

# --- Other applications ----------------------------------------------------
# Apps like Chromium and GNOME's file manager draw their own close button. With
# traffic lights on every title bar that is a second, redundant set of window
# controls, so it is turned off by default. Set this to false and re-apply from
# the settings panel to hand those buttons back.
hide_app_window_buttons = true
